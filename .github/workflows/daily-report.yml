name: Daily report → Google Sheet

on:
  schedule:
    # 08:00 Europe/Madrid (CEST) ≈ 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  sync-users-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/625219371412/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: encontrate-reporter@project-dad35149-581b-4d30-bce.iam.gserviceaccount.com

      - name: Sync Users tab
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: Users
        run: pnpm exec tsx scripts/sync-users-sheet.ts

